name: Build ScaleForge Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["main.py", "requirements.txt", ".github/workflows/build-windows.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Package Windows app
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ScaleForge --collect-all cv2 main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ScaleForge-Windows
          path: dist/ScaleForge.exe
          if-no-files-found: error
          retention-days: 14
